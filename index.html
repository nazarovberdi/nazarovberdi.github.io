    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nazarov Berdi — Frontend Engineer</title>
    <link rel="alternate" type="application/rss+xml" title="Nazarov Berdi — Writing" href="/rss.xml" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-061JQBN0YC"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() { dataLayer.push(arguments) }
      gtag('js', new Date())
      gtag('config', 'G-061JQBN0YC')
    </script>
    <script>
      const redirect = sessionStorage.redirect
      delete sessionStorage.redirect
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect)
      }
    </script>
    <script>
      // Runs before first paint, so the pre-rendered page never shows the wrong theme
      // or the hero snapping away when the app starts.
      ;(function () {
        var root = document.documentElement
        var theme = 'dark'
        try { theme = localStorage.getItem('theme') || 'dark' } catch (e) {}
        root.dataset.theme = theme === 'light' ? 'light' : ''
        root.classList.toggle('dark', theme !== 'light')

        // Hold the hero for its intro. If the app is slow, show it as is and skip the intro.
        if (location.pathname !== '/' || !matchMedia('(prefers-reduced-motion: no-preference)').matches) return
        root.classList.add('intro-pending')
        setTimeout(function () {
          if (!root.classList.contains('intro-pending')) return
          root.classList.remove('intro-pending')
          root.dataset.introSkip = ''
        }, 1000)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
