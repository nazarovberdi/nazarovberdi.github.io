<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#11100e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berdi Nazarov — Frontend Engineer</title>
    <link rel="alternate" type="application/rss+xml" title="Berdi Nazarov — Writing" href="/rss.xml" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-061JQBN0YC"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() { dataLayer.push(arguments) }
      gtag('js', new Date())
      gtag('config', 'G-061JQBN0YC')
    </script>
    <script>
      const redirect = sessionStorage.redirect
      delete sessionStorage.redirect
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect)
      }
    </script>
    <script>
      // Runs before first paint, so the pre-rendered page never shows the wrong theme
      // or the hero snapping away when the app starts.
      ;(function () {
        var root = document.documentElement
        // A stored choice wins; otherwise follow the system, as useTheme.ts does.
        var theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        try { theme = localStorage.getItem('theme') || theme } catch (e) {}
        root.dataset.theme = theme === 'light' ? 'light' : ''
        root.classList.toggle('dark', theme !== 'light')
        document.querySelector('meta[name=theme-color]').content = theme === 'light' ? '#f2ede4' : '#11100e'

        // `motion` lets reveals start hidden (see src/motion/reveal.ts). If the app
        // has not started within 2.5s, drop it so the page is never left blank.
        if (!matchMedia('(prefers-reduced-motion: no-preference)').matches) return
        root.classList.add('motion')
        setTimeout(function () {
          if (!root.classList.contains('motion-ready')) root.classList.remove('motion')
        }, 2500)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
